name: notification_service
description: Core notification service for SmartPOS - handles push, SMS, email, and in-app notifications
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Cloud Messaging
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1

  # JSON serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.14
  json_serializable: ^6.8.0

flutter:
  # No assets needed for service package
