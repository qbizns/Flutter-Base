name: hq_console
description: SmartPOS HQ Console - Multi-store management and operations hub
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Data & Formatting
  intl: ^0.20.1

  # Charts & Visualization
  fl_chart: ^0.70.2

  # Shared core
  pos_core:
    path: ../../packages/pos_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/config/
