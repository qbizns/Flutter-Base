name: manager_dashboard
description: SmartPOS Manager Dashboard - Business analytics and management
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages
  pos_core:
    path: ../../packages/pos_core

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Charts & Data Visualization
  fl_chart: ^0.69.0                        # Simple, customizable charts
  syncfusion_flutter_charts: ^27.1.48      # Advanced charts (optional)

  # Data Tables
  data_table_2: ^2.5.15                    # Enhanced data tables

  # File & Image Pickers
  file_picker: ^8.1.2                      # File upload
  image_picker: ^1.1.2                     # Image upload

  # Additional dependencies
  intl: ^0.19.0                            # Currency and date formatting
  csv: ^6.0.0                              # CSV export
  pdf: ^3.11.1                             # PDF generation
  path_provider: ^2.1.4                    # File system paths
  printing: ^5.13.2                        # PDF printing and sharing

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/
