name: kitchen_display
description: SmartPOS Kitchen Display System - Real-time kitchen order management
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages
  pos_core:
    path: ../../packages/pos_core
  pos_ui:
    path: ../../packages/pos_ui

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Additional dependencies for KDS
  intl: ^0.19.0  # For time formatting
  audioplayers: ^6.1.0  # For audio alerts
  shared_preferences: ^2.3.3  # For settings persistence

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/
