name: notification_center
description: Notification Center for SmartPOS - Manage all notifications across the system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  pos_core:
    path: ../../packages/pos_core
  notification_service:
    path: ../../packages/notification_service

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI & Utilities
  intl: ^0.20.1
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/config/
