name: admin_dashboard
description: SmartPOS Admin Dashboard - Back office management for POS system
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local packages
  pos_core:
    path: ../../packages/pos_core
  pos_ui:
    path: ../../packages/pos_ui
  device_bridge_client:
    path: ../../packages/device_bridge_client

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Charts & Visualization
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^27.1.48

  # UI Components
  data_table_2: ^2.5.15
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/config/
    - assets/images/

  fonts:
    - family: Odoo
      fonts:
        - asset: packages/pos_ui/assets/fonts/lato/Lato-Regular.ttf
        - asset: packages/pos_ui/assets/fonts/lato/Lato-Bold.ttf
          weight: 700
