name: online_ordering_portal
description: SmartPOS Online Ordering Portal - Web/PWA customer ordering with pickup and delivery
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  pos_core:
    path: ../../packages/pos_core
  intl: ^0.20.1
  badges: ^3.1.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/
